<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Contact Messages</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f3f4f6;

      color: #111827;
    }

    /* --------------------------------
       Header
    -------------------------------- */

    header {
      background: #111827;

      color: white;

      padding: 20px 30px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;
    }

    header h1 {
      margin: 0;

      font-size: 24px;
    }

    .status {
      display: flex;

      align-items: center;

      gap: 8px;

      font-size: 14px;

      color: #d1d5db;
    }

    .status-dot {
      width: 10px;

      height: 10px;

      background: #22c55e;

      border-radius: 50%;

      display: inline-block;
    }

    /* --------------------------------
       Main
    -------------------------------- */

    main {
      width: 95%;

      max-width: 1200px;

      margin: 30px auto;
    }

    .top-bar {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 20px;

      gap: 20px;
    }

    .count {
      color: #6b7280;

      font-size: 15px;
    }

    .refresh-info {
      color: #6b7280;

      font-size: 13px;
    }

    /* --------------------------------
       Messages
    -------------------------------- */

    .messages {
      display: grid;

      gap: 15px;
    }

    .message-card {
      background: white;

      border-radius: 10px;

      padding: 22px;

      box-shadow:
        0 2px 8px
        rgba(0, 0, 0, 0.08);

      border-left:
        4px solid #2563eb;
    }

    .message-header {
      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 20px;

      margin-bottom: 15px;
    }

    .sender {
      display: flex;

      flex-direction: column;

      gap: 5px;
    }

    .sender-name {
      font-size: 18px;

      font-weight: bold;
    }

    .sender-email {
      color: #2563eb;

      font-size: 14px;
    }

    .date {
      color: #6b7280;

      font-size: 13px;

      white-space: nowrap;
    }

    .message-text {
      background: #f9fafb;

      padding: 15px;

      border-radius: 7px;

      line-height: 1.6;

      white-space: pre-wrap;

      word-break: break-word;
    }

    .message-id {
      margin-top: 15px;

      color: #9ca3af;

      font-size: 12px;
    }

    /* --------------------------------
       Empty state
    -------------------------------- */

    .empty {
      background: white;

      padding: 50px;

      border-radius: 10px;

      text-align: center;

      color: #6b7280;

      box-shadow:
        0 2px 8px
        rgba(0, 0, 0, 0.08);
    }

    .empty h2 {
      color: #374151;

      margin-top: 0;
    }

    /* --------------------------------
       Error
    -------------------------------- */

    .error {
      background: #fee2e2;

      color: #991b1b;

      padding: 15px;

      border-radius: 8px;

      margin-bottom: 20px;

      display: none;
    }

    /* --------------------------------
       Mobile
    -------------------------------- */

    @media (max-width: 650px) {

      header {
        padding: 15px;

        flex-direction: column;

        align-items: flex-start;
      }

      main {
        width: 92%;

        margin: 20px auto;
      }

      .top-bar {
        flex-direction: column;

        align-items: flex-start;
      }

      .message-header {
        flex-direction: column;
      }

      .date {
        white-space: normal;
      }

    }

  </style>

</head>

<body>

  <!-- =================================
       HEADER
  ================================== -->

  <header>

    <h1>
      Contact Messages
    </h1>

    <div class="status">

      <span class="status-dot"></span>

      <span>
        Live
      </span>

    </div>

  </header>


  <!-- =================================
       MAIN
  ================================== -->

  <main>

    <div class="top-bar">

      <div>

        <strong>
          Messages
        </strong>

        <div
          class="count"
          id="messageCount"
        >
          Loading...
        </div>

      </div>

      <div
        class="refresh-info"
        id="refreshInfo"
      >
        Checking for new messages...
      </div>

    </div>


    <!-- Error message -->

    <div
      class="error"
      id="errorMessage"
    ></div>


    <!-- Messages -->

    <div
      class="messages"
      id="messages"
    ></div>

  </main>


  <!-- =================================
       JAVASCRIPT
  ================================== -->

  <script>

    // ---------------------------------
    // Configuration
    // ---------------------------------

    const REFRESH_INTERVAL = 3000;

    let previousMessageCount = 0;


    // ---------------------------------
    // Load messages
    // ---------------------------------

    async function loadMessages() {

      try {

        const response =
          await fetch("/messages");

        if (!response.ok) {

          throw new Error(
            "Could not load messages."
          );

        }

        const messages =
          await response.json();

        displayMessages(messages);

        hideError();

        updateStatus();

      } catch (error) {

        console.error(error);

        showError(
          "Unable to load messages. " +
          "Please check the server."
        );

      }

    }


    // ---------------------------------
    // Display messages
    // ---------------------------------

    function displayMessages(messages) {

      const container =
        document.getElementById("messages");

      const count =
        document.getElementById("messageCount");


      // Message count

      count.textContent =
        `${messages.length} message${
          messages.length === 1
            ? ""
            : "s"
        }`;


      // No messages

      if (messages.length === 0) {

        container.innerHTML = `

          <div class="empty">

            <h2>
              No messages yet
            </h2>

            <p>
              Messages submitted through
              your contact form will appear here.
            </p>

          </div>

        `;

        previousMessageCount = 0;

        return;
      }


      // Create cards

      container.innerHTML =
        messages.map(message => {

          const date =
            formatDate(
              message.created_at
            );

          return `

            <div
              class="message-card"
            >

              <div
                class="message-header"
              >

                <div class="sender">

                  <div
                    class="sender-name"
                  >
                    ${escapeHtml(
                      message.name
                    )}
                  </div>

                  <div
                    class="sender-email"
                  >
                    ${escapeHtml(
                      message.email
                    )}
                  </div>

                </div>

                <div class="date">
                  ${date}
                </div>

              </div>


              <div
                class="message-text"
              >
                ${escapeHtml(
                  message.message
                )}
              </div>


              <div
                class="message-id"
              >
                Message #${message.id}
              </div>

            </div>

          `;

        }).join("");


      // Detect new message

      if (
        messages.length >
        previousMessageCount
      ) {

        console.log(
          "New contact message received."
        );

      }

      previousMessageCount =
        messages.length;

    }


    // ---------------------------------
    // Format date
    // ---------------------------------

    function formatDate(dateString) {

      const date =
        new Date(dateString);

      return date.toLocaleString(
        undefined,
        {
          dateStyle: "medium",
          timeStyle: "short"
        }
      );

    }


    // ---------------------------------
    // HTML escaping
    // ---------------------------------

    function escapeHtml(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    // ---------------------------------
    // Error handling
    // ---------------------------------

    function showError(message) {

      const error =
        document.getElementById(
          "errorMessage"
        );

      error.textContent = message;

      error.style.display = "block";

    }


    function hideError() {

      const error =
        document.getElementById(
          "errorMessage"
        );

      error.style.display = "none";

    }


    // ---------------------------------
    // Update status
    // ---------------------------------

    function updateStatus() {

      const info =
        document.getElementById(
          "refreshInfo"
        );

      const time =
        new Date().toLocaleTimeString();

      info.textContent =
        `Last updated: ${time}`;

    }


    // ---------------------------------
    // Initial load
    // ---------------------------------

    loadMessages();


    // ---------------------------------
    // Automatic refresh
    // ---------------------------------

    setInterval(
      loadMessages,
      REFRESH_INTERVAL
    );

  </script>

</body>

</html>
