<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Contact Us</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #333;
    }

    .container {
      width: 90%;
      max-width: 600px;
      margin: 60px auto;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: #222;
    }

    .description {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #2563eb;
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Contact Form</h1>

    <p class="description">
      Have a question? Send us a message.
    </p>

    <form action="/contact" method="POST">

      <label for="name">
        Name
      </label>

      <input
        type="text"
        id="name"
        name="name"
        placeholder="Your name"
        maxlength="100"
        required
      >

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="you@example.com"
        maxlength="255"
        required
      >

      <label for="message">
        Message
      </label>

      <textarea
        id="message"
        name="message"
        placeholder="Write your message..."
        required
      ></textarea>

      <button type="submit">
        Send Message
      </button>

    </form>

  </div>

</body>

</html>
